openapi: 3.0.0

info:
  title: API Sistem Informasi Akademik (MVC)
  version: 1.0.0
  description: |
    REST API Sistem Informasi Akademik berbasis PHP Native (pola MVC dengan Front Controller).
    Dokumen ini adalah versi OpenAPI dari `docs/API_DOCUMENTATION.md` (Acara 21).

    **Autentikasi.** Endpoint `GET` bersifat publik. Endpoint `POST`, `PUT`, dan `DELETE`
    pada `/mahasiswa` dan `/buku` memerlukan header `Authorization: Bearer <token>`.
    Token didapat dari `POST /login` dan berlaku 300 detik.

    **Format response.** Semua response memakai envelope yang sama:
    `success`, `message`, `data`, `errors` (hanya jika ada kesalahan per field), dan `timestamp`.

    **Catatan.** ID dikirim lewat query string (`?id=1`), bukan di path.

    **Kesalahan umum.** Method selain GET/POST/PUT/DELETE pada `/mahasiswa` dan `/buku`
    dijawab 405 (header `Allow: GET, POST, PUT, DELETE`), dan resource yang tidak dikenal dijawab 404
    ("Endpoint tidak ditemukan"). Keduanya berlaku untuk semua endpoint dan tidak diulang per operasi.
  contact:
    name: Uaryl Engno Laurenca (E41250317)

servers:
  - url: http://localhost/sistem-informasi-akademik/public
    description: Lokal (XAMPP)

tags:
  - name: Autentikasi
    description: Registrasi dan login (publik). Ditangani AuthController.
  - name: Mahasiswa
    description: CRUD data mahasiswa. Ditangani MahasiswaController.
  - name: Buku
    description: CRUD data buku. Ditangani BukuController.

paths:
  /register:
    post:
      tags: [Autentikasi]
      summary: Registrasi pengguna baru (AuthController::register)
      description: |
        Publik. Urutan pemeriksaan: 400 (body bukan JSON atau field kosong),
        422 (format data tidak valid), 409 (username atau email sudah ada), lalu 201.
        Role pengguna baru selalu `user`. Method selain POST dijawab 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: andi_saputra
              email: andi@example.com
              password: rahasia123
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                success: true
                message: Registrasi berhasil
                data:
                  id: 1
                  username: andi_saputra
                  email: andi@example.com
                  role: user
                timestamp: '2026-10-24T06:40:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'
        '409':
          description: Username atau email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Username atau email sudah terdaftar
                data: null
                errors:
                  username: Username sudah dipakai
                timestamp: '2026-10-24T06:40:00+07:00'
        '422':
          description: Data tidak lolos validasi (username 3-50 karakter [A-Za-z0-9_.], email valid, password 8-72 karakter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Data tidak lolos validasi
                data: null
                errors:
                  email: Format email tidak valid
                timestamp: '2026-10-24T06:40:00+07:00'
        '500':
          $ref: '#/components/responses/ServerError'

  /login:
    post:
      tags: [Autentikasi]
      summary: Autentikasi pengguna (AuthController::login)
      description: |
        Publik. Mengembalikan token JWT (HS256) yang berlaku 300 detik.
        Pesan 401 sengaja sama untuk "username tidak ada" dan "password salah".
        Method selain POST dijawab 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: andi_saputra
              password: rahasia123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                message: Login berhasil
                data:
                  token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ...dipersingkat
                  token_type: Bearer
                  expires_in: 300
                  role: user
                timestamp: '2026-10-24T06:40:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Username atau password salah
                data: null
                timestamp: '2026-10-24T06:40:00+07:00'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'
        '500':
          $ref: '#/components/responses/ServerError'

  /mahasiswa:
    get:
      tags: [Mahasiswa]
      summary: Mengambil data mahasiswa (MahasiswaController::index)
      description: Publik. Tanpa parameter `id` mengembalikan semua data, dengan `id` mengembalikan satu data.
      parameters:
        - $ref: '#/components/parameters/IdOptional'
      responses:
        '200':
          description: Data berhasil diambil (array jika tanpa id, objek tunggal jika dengan id)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MahasiswaListResponse'
                  - $ref: '#/components/schemas/MahasiswaOneResponse'
              examples:
                semuaData:
                  summary: Tanpa parameter id
                  value:
                    success: true
                    message: Data berhasil diambil
                    data:
                      - id: 1
                        nim: '220100101'
                        nama: Andi Saputra
                        prodi: Teknik Informatika
                        created_at: '2026-10-24 06:40:00'
                    timestamp: '2026-10-24T06:40:00+07:00'
                satuData:
                  summary: Dengan ?id=1
                  value:
                    success: true
                    message: Data berhasil diambil
                    data:
                      id: 1
                      nim: '220100101'
                      nama: Andi Saputra
                      prodi: Teknik Informatika
                      created_at: '2026-10-24 06:40:00'
                    timestamp: '2026-10-24T06:40:00+07:00'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Mahasiswa]
      summary: Menambahkan data mahasiswa (MahasiswaController::store)
      description: 'Memerlukan Bearer Token. Urutan pemeriksaan: 401, 400, 422, 409, lalu 201.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaInput'
            example:
              nim: '220100101'
              nama: Andi Saputra
              prodi: Teknik Informatika
      responses:
        '201':
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
              example:
                success: true
                message: Data berhasil ditambahkan
                data:
                  id: 1
                timestamp: '2026-10-24T06:40:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: NIM sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: NIM sudah terdaftar
                data: null
                errors:
                  nim: NIM sudah dipakai mahasiswa lain
                timestamp: '2026-10-24T06:40:00+07:00'
        '422':
          description: Data tidak lolos validasi (NIM harus tepat 9 karakter, nama maks 100, prodi maks 50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Data tidak lolos validasi
                data: null
                errors:
                  nim: Format NIM tidak valid, harus 9 digit
                timestamp: '2026-10-24T06:40:00+07:00'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Mahasiswa]
      summary: Memperbarui data mahasiswa (MahasiswaController::update)
      description: 'Memerlukan Bearer Token. Urutan pemeriksaan: 401, 400 (id), 404, 400/422 (body), 409, lalu 200.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaInput'
            example:
              nim: '220100101'
              nama: Andi S
              prodi: Teknik Informatika
      responses:
        '200':
          $ref: '#/components/responses/UpdatedOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: NIM dipakai mahasiswa lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: NIM sudah dipakai mahasiswa lain
                data: null
                errors:
                  nim: NIM sudah dipakai mahasiswa lain
                timestamp: '2026-10-24T06:40:00+07:00'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Mahasiswa]
      summary: Menghapus data mahasiswa (MahasiswaController::destroy)
      description: 'Memerlukan Bearer Token. Urutan pemeriksaan: 401, 400 (id), 404, lalu 200.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdRequired'
      responses:
        '200':
          $ref: '#/components/responses/DeletedOk'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /buku:
    get:
      tags: [Buku]
      summary: Mengambil data buku (BukuController::index)
      description: Publik. Tanpa parameter `id` mengembalikan semua data, dengan `id` mengembalikan satu data.
      parameters:
        - $ref: '#/components/parameters/IdOptional'
      responses:
        '200':
          description: Data berhasil diambil (array jika tanpa id, objek tunggal jika dengan id)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BukuListResponse'
                  - $ref: '#/components/schemas/BukuOneResponse'
              examples:
                semuaData:
                  summary: Tanpa parameter id
                  value:
                    success: true
                    message: Data berhasil diambil
                    data:
                      - id: 1
                        judul: Belajar PHP Native
                        penulis: Budi Santoso
                        tahun: 2023
                        created_at: '2026-10-24 06:40:00'
                    timestamp: '2026-10-24T06:40:00+07:00'
                satuData:
                  summary: Dengan ?id=1
                  value:
                    success: true
                    message: Data berhasil diambil
                    data:
                      id: 1
                      judul: Belajar PHP Native
                      penulis: Budi Santoso
                      tahun: 2023
                      created_at: '2026-10-24 06:40:00'
                    timestamp: '2026-10-24T06:40:00+07:00'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Buku]
      summary: Menambahkan data buku (BukuController::store)
      description: 'Memerlukan Bearer Token. Urutan pemeriksaan: 401, 400, 422, lalu 201.'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
            example:
              judul: Belajar PHP Native
              penulis: Budi Santoso
              tahun: 2023
      responses:
        '201':
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
              example:
                success: true
                message: Data berhasil ditambahkan
                data:
                  id: 1
                timestamp: '2026-10-24T06:40:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Buku]
      summary: Memperbarui data buku (BukuController::update)
      description: 'Memerlukan Bearer Token. Urutan pemeriksaan: 401, 400 (id), 404, 400/422 (body), lalu 200.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
            example:
              judul: Belajar PHP Native (Edisi 2)
              penulis: Budi Santoso
              tahun: 2024
      responses:
        '200':
          $ref: '#/components/responses/UpdatedOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Buku]
      summary: Menghapus data buku (BukuController::destroy)
      description: 'Memerlukan Bearer Token. Urutan pemeriksaan: 401, 400 (id), 404, lalu 200.'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdRequired'
      responses:
        '200':
          $ref: '#/components/responses/DeletedOk'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT dari `POST /login`, dikirim lewat header `Authorization: Bearer <token>`.
        Masa berlaku 300 detik. Token hilang dijawab 401 "Token tidak ditemukan",
        token salah atau kedaluwarsa dijawab 401 "Token tidak valid atau kedaluwarsa".

  parameters:
    IdOptional:
      name: id
      in: query
      required: false
      description: ID data (angka positif). Jika dikosongkan, semua data dikembalikan.
      schema:
        type: integer
        minimum: 1
      example: 1
    IdRequired:
      name: id
      in: query
      required: true
      description: ID data yang dituju (angka positif).
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9_.]+$'
          example: andi_saputra
        email:
          type: string
          format: email
          maxLength: 100
          example: andi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: rahasia123
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: andi_saputra
        password:
          type: string
          format: password
          example: rahasia123
    MahasiswaInput:
      type: object
      required: [nim, nama, prodi]
      properties:
        nim:
          type: string
          minLength: 9
          maxLength: 9
          description: Tepat 9 karakter dan unik. Tidak harus angka (contoh NIM Polije memuat huruf).
          example: '220100101'
        nama:
          type: string
          maxLength: 100
          example: Andi Saputra
        prodi:
          type: string
          maxLength: 50
          example: Teknik Informatika
    Mahasiswa:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/MahasiswaInput'
        - type: object
          properties:
            created_at:
              type: string
              example: '2026-10-24 06:40:00'
    BukuInput:
      type: object
      required: [judul, penulis, tahun]
      properties:
        judul:
          type: string
          maxLength: 150
          example: Belajar PHP Native
        penulis:
          type: string
          maxLength: 100
          example: Budi Santoso
        tahun:
          type: integer
          minimum: 1000
          description: Angka 4 digit, paling jauh tahun depan.
          example: 2023
    Buku:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/BukuInput'
        - type: object
          properties:
            created_at:
              type: string
              example: '2026-10-24 06:40:00'

    Envelope:
      type: object
      required: [success, message, data, timestamp]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        timestamp:
          type: string
          format: date-time
          example: '2026-10-24T06:40:00+07:00'
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            success:
              type: boolean
              example: false
            data:
              nullable: true
              example: null
            errors:
              type: object
              description: Pesan kesalahan per field. Hanya ada bila terjadi kesalahan validasi.
              additionalProperties:
                type: string
    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                id: { type: integer, example: 1 }
                username: { type: string, example: andi_saputra }
                email: { type: string, example: andi@example.com }
                role: { type: string, example: user }
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                token_type: { type: string, example: Bearer }
                expires_in: { type: integer, example: 300 }
                role: { type: string, example: user }
    CreatedResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                id: { type: integer, example: 1 }
    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              nullable: true
              example: null
    MahasiswaListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Mahasiswa'
    MahasiswaOneResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Mahasiswa'
    BukuListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Buku'
    BukuOneResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Buku'

  responses:
    BadRequest:
      description: Body bukan JSON valid, atau field wajib kosong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            fieldKosong:
              summary: Field wajib kosong (contoh pada POST /mahasiswa)
              value:
                success: false
                message: Field nim, nama, dan prodi wajib diisi
                data: null
                errors:
                  nim: Field nim wajib diisi
                timestamp: '2026-10-24T06:40:00+07:00'
            loginKosong:
              summary: Field wajib kosong (contoh pada POST /login)
              value:
                success: false
                message: Username dan password wajib diisi
                data: null
                errors:
                  password: Field password wajib diisi
                timestamp: '2026-10-24T06:40:00+07:00'
            registerKosong:
              summary: Field wajib kosong (contoh pada POST /register)
              value:
                success: false
                message: Username, email, dan password wajib diisi
                data: null
                errors:
                  password: Field password wajib diisi
                timestamp: '2026-10-24T06:40:00+07:00'
            bodyBukanJson:
              summary: Body bukan JSON valid
              value:
                success: false
                message: Body harus berupa JSON yang valid
                data: null
                timestamp: '2026-10-24T06:40:00+07:00'
    InvalidId:
      description: Parameter id tidak ada atau bukan angka positif
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Parameter id wajib berupa angka positif
            data: null
            errors:
              id: 'ID harus berupa angka positif, contoh: ?id=1'
            timestamp: '2026-10-24T06:40:00+07:00'
    Unauthorized:
      description: Token tidak ada, tidak valid, atau kedaluwarsa
      headers:
        WWW-Authenticate:
          description: Selalu `Bearer`; ditambah `error="invalid_token"` bila token tidak valid.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tanpaToken:
              summary: Header Authorization tidak dikirim
              value:
                success: false
                message: Token tidak ditemukan
                data: null
                timestamp: '2026-10-24T06:40:00+07:00'
            tokenTidakValid:
              summary: Token salah atau kedaluwarsa
              value:
                success: false
                message: Token tidak valid atau kedaluwarsa
                data: null
                timestamp: '2026-10-24T06:40:00+07:00'
    NotFound:
      description: Data dengan id tersebut tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data tidak ditemukan
            data: null
            timestamp: '2026-10-24T06:40:00+07:00'
    ValidationFailed:
      description: Data tidak lolos validasi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Data tidak lolos validasi
            data: null
            errors:
              tahun: Tahun harus berupa angka 4 digit yang valid
            timestamp: '2026-10-24T06:40:00+07:00'
    MethodNotAllowedPost:
      description: Method selain POST
      headers:
        Allow:
          description: Method yang diizinkan
          schema:
            type: string
            example: POST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
