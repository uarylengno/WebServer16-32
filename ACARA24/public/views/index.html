<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Mahasiswa</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #52606d;
            --line: #d9e2ec;
            --accent: #1f6feb;
            --ok-bg: #e6f6ec;   --ok-text: #14532d;
            --err-bg: #fdecea;  --err-text: #7f1d1d;
            --info-bg: #eaf1fe; --info-text: #1e3a8a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12161c; --card: #1b212a; --text: #e6ebf1; --muted: #9aa5b1; --line: #2d3642;
                --accent: #6ea8ff;
                --ok-bg: #12301f; --ok-text: #9be0b4;
                --err-bg: #3a1717; --err-text: #f3b4b4;
                --info-bg: #172544; --info-text: #b4ccff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
        }
        main { max-width: 760px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin: 0 0 4px; }
        p.sub { margin: 0 0 20px; color: var(--muted); }
        .bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
        button {
            font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
            background: var(--accent); color: #fff; cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: progress; }
        .status { padding: 10px 14px; border-radius: 8px; margin: 0; flex: 1 1 240px; }
        .status-memuat, .status-kosong { background: var(--info-bg); color: var(--info-text); }
        .status-ok { background: var(--ok-bg); color: var(--ok-text); }
        .status-error { background: var(--err-bg); color: var(--err-text); }
        .tabel-bungkus { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
        th { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
        tbody tr:last-child td { border-bottom: 0; }
        .tabel-bungkus:has(table[hidden]) { display: none; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>Data Mahasiswa</h1>
        <p class="sub">Diambil dari API Sistem Informasi Akademik (<code>GET /mahasiswa</code>).</p>

        <div class="bar">
            <p id="status" class="status status-memuat" role="status" aria-live="polite">Memuat data...</p>
            <button id="tombol-muat" type="button">Muat ulang</button>
        </div>

        <div class="tabel-bungkus">
            <table id="tabel-mahasiswa" hidden>
                <thead><tr><th>NIM</th><th>Nama</th><th>Program Studi</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
